name: ci

# Every push and every pull request. The tests are the specification here —
# `foldrun check`'s rules, the grammar, the runner's contracts — so a red
# build is a broken promise, not a style complaint.
on:
  push:
    branches: [main]
  pull_request:
  # release-pr.yml starts it on release/next: its own push starts nothing.
  workflow_dispatch:

permissions:
  contents: read

# One run per ref; a newer push/PR update cancels the older one (FOL-62, box runner).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # GitHub's hosted runner: this repository is public (25 Oct 2026), and a
    # public repository never runs on our own machines — a pull request from
    # a fork would run its code there. Hosted minutes are free for public
    # repositories.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Full matrix on push to main; the supported floor only on PRs (FOL-62).
        node: ${{ github.event_name == 'pull_request' && fromJSON('["22"]') || fromJSON('["22", "24"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: foldrun-cli
      # The sibling: the CLI is developed against foldrun-core's source
      # (`../foldrun-core`, the layout is the wiring). Tests import
      # @foldrun/core, never the sibling's path, because release.yml has no
      # sibling and tests against the published core.
      # Read access to the sibling: every foldrun repository is private since
      # 17 Oct 2026, so the job's own token cannot read it. The foldrun-bot
      # App mints one per run, read-only, for that repository alone.
      - name: a read token for the sibling, from the App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FOLDRUN_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FOLDRUN_BOT_PRIVATE_KEY }}
          owner: foldrun-io
          repositories: foldrun-core
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: foldrun-io/foldrun-core
          token: ${{ steps.app.outputs.token }}
          path: foldrun-core
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            foldrun-cli/package-lock.json
            foldrun-core/package-lock.json
      - run: npm ci --include=dev
        working-directory: foldrun-core
      - run: npm ci
        working-directory: foldrun-cli
      # Link the sibling over the registry copy, the way a developer's
      # checkout has it. A release of the CLI still needs the core version
      # it was written against to be published first.
      - run: npm install --no-save ../foldrun-core
        working-directory: foldrun-cli
      - run: npm test
        working-directory: foldrun-cli
      # The .mjs sources checked from their JSDoc (tsconfig.json says what
      # is and is not enforced, and why). Cheap, and it catches the null
      # that a test would only find by running the one path that hits it.
      - run: npm run typecheck
        working-directory: foldrun-cli
