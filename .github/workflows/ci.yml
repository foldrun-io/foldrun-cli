name: ci

# Every push and every pull request. The tests are the specification here —
# `foldrun check`'s rules, the grammar, the runner's contracts — so a red
# build is a broken promise, not a style complaint.
#
# Against core's main as well (FOL-92): on 23 Oct the CLI went red against
# core main while its own CI stayed green, because a core change re-ran
# nothing here. foldrun-core's ci now sends a `core-main` repository_dispatch
# when its main passes, a nightly schedule catches a dispatch that never
# came, and workflow_dispatch takes a core ref to test against by hand.
on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [core-main]
  schedule:
    - cron: "3 15 * * *"   # nightly, against core's main
  # release-pr.yml starts it on release/next: its own push starts nothing.
  workflow_dispatch:
    inputs:
      core_ref:
        description: "foldrun-core ref to test against (empty: main)"
        required: false
        default: ""

permissions:
  contents: read

# One run per ref; a newer push/PR update cancels the older one (FOL-62, box runner).
# A run against core's main has its own group, so it never cancels a push's.
concurrency:
  group: ci-${{ github.ref }}${{ (github.event_name == 'repository_dispatch' || github.event_name == 'schedule') && '-core' || '' }}
  cancel-in-progress: true

jobs:
  # The security gate every foldrun repo runs (.githooks/security.sh, synced
  # from foldrun-infra): secrets in the push and the tree, Semgrep, npm audit
  # and registry signatures, a CycloneDX SBOM kept as an artifact. No secrets
  # here, so a fork's pull request runs it too.
  security:
    # This repository's own changes: not re-run when only core moved.
    if: github.event_name != 'repository_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: install (no scripts) — this repo and its nested apps
        run: for d in . */; do [ -f "$d/package-lock.json" ] && [ "$d" != node_modules/ ] && (cd "$d" && npm ci --ignore-scripts --no-audit --no-fund); done; true
      - name: security gate
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .githooks/security.sh "$BASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('sbom/*.cdx.json') != ''
        with:
          name: sbom
          path: sbom/
          retention-days: 30

  test:
    # GitHub's hosted runner: this repository is public (25 Oct 2026), and a
    # public repository never runs on our own machines — a pull request from
    # a fork would run its code there. Hosted minutes are free for public
    # repositories.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Full matrix on push to main; the supported floor only on PRs (FOL-62).
        node: ${{ github.event_name == 'pull_request' && fromJSON('["22"]') || fromJSON('["22", "24"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: foldrun-cli
      # The sibling: the CLI is developed against foldrun-core's source
      # (`../foldrun-core`, the layout is the wiring). Tests import
      # @foldrun/core, never the sibling's path, because release.yml has no
      # sibling and tests against the published core.
      # foldrun-core is public (since 25 Oct 2026), so the job's own token
      # reads it: no App token, which pull requests from Dependabot or a fork
      # are never given (their secrets are empty) and failed on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: foldrun-io/foldrun-core
          path: foldrun-core
          # The commit core's ci dispatched, or the ref asked for by hand;
          # empty is core's main.
          ref: ${{ github.event.client_payload.sha || inputs.core_ref || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            foldrun-cli/package-lock.json
            foldrun-core/package-lock.json
      - run: npm ci --include=dev
        working-directory: foldrun-core
      - run: npm ci
        working-directory: foldrun-cli
      # Link the sibling over the registry copy, the way a developer's
      # checkout has it. A release of the CLI still needs the core version
      # it was written against to be published first.
      - run: npm install --no-save ../foldrun-core
        working-directory: foldrun-cli
      - run: npm test
        working-directory: foldrun-cli
      # The .mjs sources checked from their JSDoc (tsconfig.json says what
      # is and is not enforced, and why). Cheap, and it catches the null
      # that a test would only find by running the one path that hits it.
      - run: npm run typecheck
        working-directory: foldrun-cli

  # The release pull request passed: wake release-merge.yml (27 Oct 2026).
  # Its own workflow_run never fires for this run — GITHUB_TOKEN started it —
  # but a workflow_dispatch from GITHUB_TOKEN does. release-merge checks the
  # evidence itself; this only says "look now".
  release-hint:
    needs: test
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'release/next' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && github.ref_name == 'release/next')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        # GitHub answers this with a 5xx now and then (4 Nov 2026). This job is
        # part of ci, and release-merge.yml merges only on a green ci, so a red
        # hint held release 14.3.3 for an hour. Three tries, then a warning:
        # release-merge's own schedule merges the release anyway.
        run: |
          for n in 1 2 3; do
            gh workflow run release-merge.yml -R "$GITHUB_REPOSITORY" --ref main && exit 0
            if [ "$n" -lt 3 ]; then sleep $((n * 20)); fi
          done
          echo "::warning::could not start release-merge.yml — its schedule merges this release"
